name: Windows-App bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Oberfläche bauen
        run: npm run build

      - name: Desktop-Abhängigkeiten
        working-directory: desktop
        run: npm ci

      - name: .exe bauen
        working-directory: desktop
        run: npm run dist:win

      - name: Startet die App? (Smoke-Test)
        shell: pwsh
        run: |
          $env:LOCALNOTE_DB = "$env:RUNNER_TEMP\smoke.db"
          $p = Start-Process -FilePath "desktop\release\win-unpacked\LocalNote.exe" -PassThru
          Start-Sleep -Seconds 20
          $ok = Test-Path $env:LOCALNOTE_DB
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "LocalNote.exe hat die Datenbank nicht angelegt (Server nicht gestartet)" }
          Write-Host "OK: Datenbank angelegt, Server läuft in der gepackten App"

      - name: .exe als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LocalNote-Windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Version bestimmen
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Auf main (oder per Hand gestartet): Release für die Version aus desktop/package.json anlegen,
      # falls es sie noch nicht gibt. Version hochsetzen = neues Release.
      - name: Release vorhanden?
        id: exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release veröffentlichen
        if: >-
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/v') ||
          steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag) }}
          name: LocalNote ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: desktop/release/*.exe
          generate_release_notes: true
          body: |
            **Download:** `LocalNote-Setup-*.exe` (empfohlen: installiert ohne Admin, Desktop-Verknüpfung) oder `LocalNote-*-portable.exe` (ohne Installation).

            Windows warnt beim ersten Start, weil die App nicht signiert ist: **Weitere Informationen → Trotzdem ausführen**.

            Daten liegen in `%APPDATA%\LocalNote\localnote.db`. Für den Feynman-Check Ollama separat installieren (siehe README).
